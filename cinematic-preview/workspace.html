<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Your Workspace · Proverbs 31</title>
    <link rel="stylesheet" href="assets/admin.css" />
    <link rel="stylesheet" href="assets/service-updates.css" />
    <link rel="stylesheet" href="assets/workflow.css" />
    <link rel="stylesheet" href="assets/workspace-mobile.css" /><link rel="stylesheet" href="assets/work-gallery.css" /><link rel="stylesheet" href="assets/booking-media-slots.css" />
  </head>
  <body class="workspace-app">
    <link rel="stylesheet" href="assets/mobile-navigation.css"/><script src="assets/mobile-navigation.js" defer></script><header>
      <a class="brand" href="index.html"
        ><img
          src="assets/proverbs31-logo.png"
          alt="Proverbs 31 Cleaning Company logo"
        /><span>PROVERBS 31<small>CLEANING COMPANY</small></span></a
      >
      <nav>
        <a href="index.html">Website Home</a><button type="button" id="dashboard-home" class="outline" hidden>Dashboard Home</button><a href="care.html">Book a cleaning</a
        ><button class="outline" id="sign-out" hidden aria-label="Log out of your account">Log out</button>
      </nav>
    </header>
    <div class="app-shell">
      <aside class="sidebar">
        <p class="eyebrow" id="workspace-role">YOUR CARE WORKSPACE</p>
        <nav id="workspace-nav"></nav>
      </aside>
      <main>
        <div class="page-heading">
          <div>
            <h1 id="workspace-title" tabindex="-1">Opening your workspace…</h1>
            <p id="workspace-subtitle"></p>
            <p id="workspace-sync-status" class="fine" role="status" hidden></p>
          </div>
          <button class="outline" id="refresh" hidden>Refresh</button>
        </div>
        <p id="workspace-message" role="status" aria-live="polite"></p>
        <section id="admin-attention" aria-label="Needs your attention" hidden></section>
        <div id="workspace-updates" class="info-strip" role="status" hidden></div>
        <section id="workspace-content"></section>
      </main>
    </div>
    <dialog id="workspace-dialog" aria-label="Booking details">
      <div class="dialog-header">
        <h2>Booking details</h2>
        <button
          class="close"
          id="close-workspace-dialog"
          aria-label="Close booking"
        >
          ×
        </button>
      </div>
      <p id="dialog-message" role="status" aria-live="polite"></p>
      <div id="booking-update-notice" class="info-strip" role="status" hidden></div>
      <div id="workspace-detail"></div>
    </dialog>
    <nav id="mobile-workspace-nav" aria-label="Workspace navigation"></nav>
    <dialog id="workspace-menu" aria-labelledby="workspace-menu-title">
      <div class="dialog-header"><h2 id="workspace-menu-title">Your workspace</h2><button class="close" id="close-workspace-menu" aria-label="Close workspace menu">×</button></div>
      <div id="workspace-menu-options"></div>
      <a class="outline" href="index.html">Back to home</a>
    </dialog>
    <script src="assets/backend-client.js"></script>
    <script src="assets/schedule-windows.js"></script>
    <script src="assets/proverbs-cal.js"></script>
    <script src="assets/workflow-tools.js"></script>
    <script src="assets/auto-sync.js"></script>
    <script src="assets/social-links.js"></script><script src="assets/agreement-builder.js"></script><script src="assets/agreement-template.js"></script><script src="assets/agreement-pdf.js"></script><script src="assets/access-authorization.js"></script><script src="assets/booking-checklist.js"></script><script src="assets/launch-preparation.js"></script><script src="assets/payments-ui.js"></script><script src="assets/privacy-operations.js"></script><script src="assets/admin-notifications.js"></script><script src="assets/account-closure.js"></script><script src="assets/gallery-admin.js"></script><script src="assets/class-workspace.js"></script><script src="assets/booking-media-slots.js"></script><script src="assets/workspace.js"></script>
  </body>
</html>
